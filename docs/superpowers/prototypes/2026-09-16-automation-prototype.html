<!DOCTYPE html>
<html lang="zh-CN" data-appearance="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>自动化 · 独立页面原型</title>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    }
    html[data-appearance="light"] {
      --bg: #f4f4f4; --panel: #fff; --sidebar: #f7f7f7;
      --line: #e4e4e4; --muted: #6f6f6f; --text: #171717;
      --fill: #f3f3f3; --fill2: #ededed; --accent: #3e63dd; --accent-dim: #eef4ff;
      --green: #18794e; --amber: #ad5700; --red: #cd2b31; --overlay: rgba(0,0,0,.4);
    }
    html[data-appearance="dark"] {
      --bg: #111; --panel: #181818; --sidebar: #161616;
      --line: #2e2e2e; --muted: #8d8d8d; --text: #ececec;
      --fill: #1c1c1c; --fill2: #2a2a2a; --accent: #6e93f8; --accent-dim: #1c2740;
      --green: #3dd68c; --amber: #ffb224; --red: #f2555a; --overlay: rgba(0,0,0,.55);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font); font-size: 13px; color: var(--text);
      background: var(--bg); display: flex; flex-direction: column;
    }
    .banner {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 14px; border-bottom: 1px solid var(--line);
      background: var(--fill); color: var(--muted); font-size: 12px;
    }
    .tag { border: 1px solid var(--red); color: var(--red); border-radius: 4px; padding: 0 5px; font-size: 11px; font-weight: 600; }
    .banner button, .btn {
      font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--fill2); color: var(--text); cursor: pointer;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-ghost { background: transparent; }
    .btn-danger { color: var(--red); background: transparent; }
    .shell { flex: 1; min-height: 0; display: flex; }
    .sidebar {
      width: 232px; flex-shrink: 0; background: var(--sidebar);
      border-right: 1px solid var(--line); display: flex; flex-direction: column;
    }
    .traffic { height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px; }
    .traffic i { width: 12px; height: 12px; border-radius: 50%; }
    .traffic i:nth-child(1) { background: #ff5f57; }
    .traffic i:nth-child(2) { background: #febc2e; }
    .traffic i:nth-child(3) { background: #28c840; }
    .nav {
      margin: 2px 8px; padding: 8px 10px; border: none; border-radius: 8px;
      background: transparent; color: var(--text); text-align: left; cursor: pointer; font: inherit;
    }
    .nav:hover { background: var(--fill2); }
    .nav.active { background: var(--accent-dim); color: var(--accent); }
    .tree { flex: 1; overflow: auto; padding: 8px; }
    .sec { font-size: 11px; color: var(--muted); padding: 10px 8px 4px; font-weight: 600; letter-spacing: .04em; }
    .srow { padding: 6px 8px; border-radius: 6px; }
    .foot { padding: 10px; border-top: 1px solid var(--line); color: var(--muted); }
    .main { flex: 1; min-width: 0; background: var(--panel); display: flex; flex-direction: column; }
    .page { flex: 1; min-height: 0; overflow: auto; }
    .page-inner { max-width: 860px; margin: 0 auto; padding: 28px 32px 64px; }
    .page-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 22px; }
    .page-head h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
    .page-head p { margin: 6px 0 0; color: var(--muted); }
    .grow { flex: 1; }
    .card {
      display: flex; align-items: center; gap: 14px; width: 100%;
      padding: 14px 16px; margin-bottom: 8px;
      border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    }
    .card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--fill); }
    .card.off { opacity: .72; }
    .card-body { flex: 1; min-width: 0; }
    .card-title { font-weight: 600; font-size: 14px; }
    .card-sub { margin-top: 4px; color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
    .pill {
      display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px;
      border-radius: 999px; background: var(--fill2); color: var(--muted); font-size: 11px;
    }
    .card-meta { flex-shrink: 0; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
    .dot.ok { background: var(--green); }
    .dot.run { background: var(--accent); }
    .dot.fail { background: var(--red); }
    .dot.skip { background: var(--amber); }
    .switch {
      width: 36px; height: 20px; border-radius: 99px; border: none; padding: 2px; cursor: pointer;
      background: var(--fill2); flex-shrink: 0;
    }
    .switch.on { background: var(--accent); }
    .switch i { display: block; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .switch.on i { transform: translateX(16px); }
    .back {
      border: none; background: transparent; color: var(--muted); cursor: pointer; font: inherit; padding: 0 0 10px;
    }
    .back:hover { color: var(--text); }
    .ed-title {
      font-size: 22px; font-weight: 650; letter-spacing: -.02em; outline: none;
      min-height: 1.2em; margin: 0 0 10px;
    }
    .ed-title:empty::before { content: "未命名"; color: var(--muted); }
    .ed-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .ed-meta .div { width: 1px; height: 14px; background: var(--line); }
    select, input[type="time"], input[type="datetime-local"], input[type="number"] {
      font: inherit; color: var(--text); background: var(--fill); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 12px;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line); background: var(--fill); border-radius: 10px; padding: 8px 12px;
    }
    .tabs { display: flex; gap: 6px; margin: 8px 0 22px; }
    .tab {
      border: none; background: transparent; color: var(--muted); padding: 5px 12px;
      border-radius: 999px; cursor: pointer; font: inherit;
    }
    .tab.on { background: var(--fill2); color: var(--text); }
    .sec-label { font-size: 13px; margin: 0 0 8px; }
    .hint { color: var(--muted); font-size: 12px; font-weight: 400; }
    .add-trig, .trig-card {
      width: 100%; border: 1px solid var(--line); border-radius: 12px;
      background: transparent; color: var(--muted); padding: 14px 16px; text-align: left; font: inherit;
    }
    .add-trig { cursor: pointer; margin-top: 8px; }
    .add-trig:hover { background: var(--fill); color: var(--text); }
    .trig-card { margin-bottom: 10px; color: var(--text); }
    .trig-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .menu { position: relative; }
    .menu-pop {
      position: absolute; top: 100%; left: 0; margin-top: 6px; z-index: 5;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 200px;
      box-shadow: 0 12px 32px rgba(0,0,0,.35); padding: 4px;
    }
    .menu-pop button {
      display: block; width: 100%; text-align: left; border: none; background: transparent;
      color: var(--text); padding: 8px 10px; border-radius: 8px; cursor: pointer; font: inherit;
    }
    .menu-pop button:hover { background: var(--fill2); }
    .seg {
      display: inline-flex; background: var(--fill2); border-radius: 12px; padding: 3px; gap: 2px; margin: 10px 0;
    }
    .seg button {
      border: none; background: transparent; color: var(--muted); padding: 7px 16px;
      border-radius: 10px; cursor: pointer; font: inherit;
    }
    .seg button.on { background: var(--fill); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
    .freq-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .instr {
      position: relative; border: 1px solid var(--line); border-radius: 12px; min-height: 200px;
      display: flex; flex-direction: column;
    }
    .instr textarea {
      flex: 1; min-height: 160px; border: none; background: transparent; resize: vertical;
      padding: 14px 16px 40px; color: var(--text); font: inherit; outline: none;
    }
    .instr-model { position: absolute; left: 12px; bottom: 10px; }
    .run {
      width: 100%; text-align: left; border: none; background: transparent; color: inherit; font: inherit;
      padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px;
    }
    .run:hover { color: var(--accent); }
    .mono { font-family: var(--mono); font-size: 11px; color: var(--muted); }
    .chat-welcome { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); }
    .mask { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; z-index: 20; }
    .dlg { width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
    .dlg h2 { margin: 0 0 8px; font-size: 16px; }
    .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 12px; z-index: 40;
    }
    .hidden { display: none !important; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 92vw);
      background: var(--panel); border-left: 1px solid var(--line); z-index: 15;
      display: flex; flex-direction: column;
    }
    .drawer-h { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
    .msgs { flex: 1; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { padding: 10px 12px; border-radius: 10px; background: var(--fill); line-height: 1.5; }
    .bubble .k { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .empty-page { padding: 48px 0; color: var(--muted); text-align: center; }
    .checks { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="banner">
    <span class="tag">PROTOTYPE</span>
    新建/编辑是整页编辑器（设置 / 运行记录），定时用「周期 · 按间隔 · 单次」，不填 cron 字符串。
    <span class="grow"></span>
    <button type="button" id="themeBtn">浅色</button>
  </div>
  <div class="shell">
    <aside class="sidebar">
      <div class="traffic"><i></i><i></i><i></i></div>
      <button class="nav" type="button" id="navChat">新对话</button>
      <button class="nav active" type="button" id="navAuto">自动化</button>
      <div class="tree">
        <div class="sec">工作空间</div>
        <div class="srow">muse-work</div>
        <div class="sec">待办事项</div>
        <div class="srow">登录校验失败</div>
      </div>
      <div class="foot">Muse</div>
    </aside>
    <section class="main">
      <div id="viewChat" class="chat-welcome hidden">日常会话区 · 点「自动化」进入独立页面</div>
      <div id="viewList" class="page">
        <div class="page-inner">
          <div class="page-head">
            <div>
              <h1>自动化</h1>
              <p>按定时或本机 Issue 事件无人值守跑 Agent。运行记录不进日常会话。</p>
            </div>
            <span class="grow"></span>
            <button class="btn btn-primary" type="button" id="btnNew">新建自动化</button>
          </div>
          <div id="cardList"></div>
        </div>
      </div>
      <div id="viewEditor" class="page hidden">
        <div class="page-inner">
          <button class="back" type="button" id="btnBack">← 全部自动化</button>
          <div class="ed-title" id="edTitle" contenteditable="true" spellcheck="false"></div>
          <div class="ed-meta">
            <button class="switch" type="button" id="edSwitch" aria-label="启用"><i></i></button>
            <span id="edEnabledLabel">已停用</span>
            <span class="div"></span>
            <select id="edDir">
              <option value="">选择工作目录</option>
              <option value="~/muse-work">~/muse-work</option>
              <option value="~/popo-chat">~/popo-chat</option>
            </select>
            <span class="div"></span>
            <span>权限 · 工作区</span>
            <span class="grow"></span>
            <button class="btn" type="button" id="btnRun">立即运行</button>
            <button class="btn btn-danger" type="button" id="btnDel">删除</button>
          </div>
          <div class="tabs">
            <button class="tab on" type="button" data-tab="settings">设置</button>
            <button class="tab" type="button" data-tab="history">运行记录</button>
          </div>
          <div id="paneSettings">
            <div class="sec-label">触发器</div>
            <div id="trigList"></div>
            <div class="menu">
              <button class="add-trig" type="button" id="btnAddTrig">+ 添加触发器</button>
              <div class="menu-pop hidden" id="trigMenu">
                <button type="button" data-add="schedule">定时调度</button>
                <button type="button" data-add="issue">Issue 生命周期</button>
              </div>
            </div>
            <div class="sec-label" style="margin-top:28px">Agent 指令</div>
            <div class="instr">
              <textarea id="edPrompt" placeholder="输入指令。可用 @ 提及文件，/ 调用命令…"></textarea>
              <select class="instr-model" id="edModel">
                <option>默认模型</option>
                <option>High Fast</option>
              </select>
            </div>
          </div>
          <div id="paneHistory" class="hidden">
            <div id="edRuns"></div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <aside class="drawer hidden" id="drawer">
    <div class="drawer-h">
      <strong id="drawerTitle">运行</strong>
      <span class="grow"></span>
      <button class="btn btn-ghost" type="button" id="btnStop" hidden>停止</button>
      <button class="btn btn-ghost" type="button" id="drawerClose">关闭</button>
    </div>
    <div class="msgs" id="drawerMsgs"></div>
    <div style="padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px">只读 transcript</div>
  </aside>
  <div class="mask hidden" id="delMask">
    <div class="dlg">
      <h2>删除这条自动化？</h2>
      <p style="color:var(--muted);margin:0">规则从列表消失。正在跑的会先停。</p>
      <div class="dlg-actions">
        <button type="button" class="btn" id="delCancel">取消</button>
        <button type="button" class="btn btn-danger" id="delOk">删除</button>
      </div>
    </div>
  </div>
  <div class="toast hidden" id="toast"></div>
  <script>
    const CYCLE = [
      ["daily", "每天"], ["weekday", "工作日"],
      ["1", "每周一"], ["2", "每周二"], ["3", "每周三"],
      ["4", "每周四"], ["5", "每周五"], ["6", "每周六"], ["0", "每周日"],
    ];
    const rules = [
      {
        id: "a1", name: "工作日 changelog 巡检", enabled: true, dir: "~/muse-work",
        prompt: "检查 docs/ 与 CHANGELOG 是否过期，只总结，不改代码。", model: "默认模型",
        triggers: [{ id: "t1", type: "schedule", mode: "cycle", cycle: "weekday", time: "09:00" }],
        runs: [
          { id: "r1", status: "succeeded", when: "今天 09:00", kind: "定时" },
          { id: "r2", status: "skipped", when: "昨天 09:00", kind: "定时", skip: "当时已有一轮在跑" },
        ],
      },
      {
        id: "a2", name: "待审核收口摘要", enabled: true, dir: "~/muse-work",
        prompt: "根据 Issue 标题和描述写一段给用户的摘要。", model: "默认模型",
        triggers: [{ id: "t2", type: "issue", events: ["review"] }],
        runs: [
          { id: "r3", status: "running", when: "刚刚", kind: "Issue · 登录校验失败" },
          { id: "r4", status: "succeeded", when: "周一 18:12", kind: "Issue · 面板快捷键" },
        ],
      },
      {
        id: "a3", name: "周末依赖审计", enabled: false, dir: "~/muse-work",
        prompt: "列出过期 npm 依赖，不要升级。", model: "默认模型",
        triggers: [{ id: "t3", type: "schedule", mode: "cycle", cycle: "6", time: "10:00" }],
        runs: [{ id: "r5", status: "succeeded", when: "上周六 10:00", kind: "定时" }],
      },
    ];

    let page = "list";
    let selectedId = null;
    let openRunId = null;
    let editorTab = "settings";
    const $ = (id) => document.getElementById(id);
    const toast = (t) => {
      const el = $("toast");
      el.textContent = t;
      el.classList.remove("hidden");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.add("hidden"), 2200);
    };
    const statusLabel = (s) => ({ running: "执行中", succeeded: "成功", failed: "失败", stopped: "已停止", skipped: "已跳过" })[s] || s;
    const last = (r) => r.runs[0];
    const cycleLabel = (v) => (CYCLE.find((x) => x[0] === v) || ["", v])[1];
    const trigSummary = (r) => r.triggers.map((t) => {
      if (t.type === "issue") return "Issue · " + (t.events || []).join("/");
      if (t.mode === "interval") return "每 " + t.every + " " + (t.unit === "h" ? "小时" : "分钟");
      if (t.mode === "once") return "单次 " + (t.at || "");
      return cycleLabel(t.cycle) + " " + (t.time || "");
    }).join(" · ") || "未设置触发器";

    function showPages() {
      $("viewChat").classList.toggle("hidden", page !== "chat");
      $("viewList").classList.toggle("hidden", page !== "list");
      $("viewEditor").classList.toggle("hidden", page !== "editor");
      $("navChat").classList.toggle("active", page === "chat");
      $("navAuto").classList.toggle("active", page === "list" || page === "editor");
    }

    function renderList() {
      if (!rules.length) {
        $("cardList").innerHTML = `<div class="empty-page">还没有自动化。点右上角新建。</div>`;
        return;
      }
      $("cardList").innerHTML = rules.map((r) => {
        const L = last(r);
        const s = L?.status;
        const dc = !r.enabled ? "" : s === "running" ? "run" : s === "succeeded" ? "ok" : s === "skipped" ? "skip" : s ? "fail" : "";
        return `<div class="card${r.enabled ? "" : " off"}" data-open="${r.id}" role="button" tabindex="0">
          <button class="switch${r.enabled ? " on" : ""}" type="button" data-toggle="${r.id}"><i></i></button>
          <div class="card-body">
            <div class="card-title">${r.name || "未命名"}</div>
            <div class="card-sub"><span class="pill">${trigSummary(r)}</span><span>${r.dir || "未选目录"}</span></div>
          </div>
          <span class="pill card-meta"><span class="dot ${dc}"></span> ${
            r.enabled ? (L ? statusLabel(L.status) + " · " + L.when : "尚未运行") : "已停用"
          }</span>
        </div>`;
      }).join("");
    }

    function freqBody(t) {
      if (t.mode === "interval") {
        return `<div class="freq-row">
          <span>每</span>
          <input type="number" min="1" value="${t.every || 1}" data-f="every" style="width:72px" />
          <select data-f="unit">
            <option value="h" ${t.unit === "h" ? "selected" : ""}>小时</option>
            <option value="m" ${t.unit === "m" ? "selected" : ""}>分钟</option>
          </select>
        </div>`;
      }
      if (t.mode === "once") {
        return `<div class="freq-row"><input type="datetime-local" data-f="at" value="${t.at || ""}" /></div>`;
      }
      return `<div class="freq-row">
        <select data-f="cycle">${CYCLE.map(([v, l]) => `<option value="${v}" ${t.cycle === v ? "selected" : ""}>${l}</option>`).join("")}</select>
        <span class="chip"><input type="time" data-f="time" value="${t.time || "09:00"}" style="border:none;background:transparent;padding:0" /> 🕒</span>
      </div>`;
    }

    function renderTriggers(r) {
      $("trigList").innerHTML = r.triggers.map((t) => {
        if (t.type === "issue") {
          const ev = t.events || [];
          return `<div class="trig-card" data-tid="${t.id}">
            <div class="trig-top"><strong>Issue 生命周期</strong><span class="grow"></span>
              <button class="btn btn-ghost" type="button" data-rm="${t.id}">移除</button></div>
            <div class="checks">
              ${["created:创建","review:待审核","completed:完成","cancelled:取消"].map((x) => {
                const [v, l] = x.split(":");
                return `<label><input type="checkbox" data-ev="${v}" ${ev.includes(v) ? "checked" : ""}/> ${l}</label>`;
              }).join("")}
            </div>
          </div>`;
        }
        return `<div class="trig-card" data-tid="${t.id}">
          <div class="trig-top"><strong>定时调度</strong><span class="grow"></span>
            <button class="btn btn-ghost" type="button" data-rm="${t.id}">移除</button></div>
          <div class="sec-label">执行频率 <span class="hint">高峰期可能排队，非高峰更稳定</span></div>
          <div class="seg">
            <button type="button" data-mode="cycle" class="${t.mode === "cycle" ? "on" : ""}">周期</button>
            <button type="button" data-mode="interval" class="${t.mode === "interval" ? "on" : ""}">按间隔</button>
            <button type="button" data-mode="once" class="${t.mode === "once" ? "on" : ""}">单次</button>
          </div>
          ${freqBody(t)}
        </div>`;
      }).join("");
    }

    function renderEditor() {
      const r = rules.find((x) => x.id === selectedId);
      if (!r) return;
      $("edTitle").textContent = r.name;
      $("edSwitch").classList.toggle("on", r.enabled);
      $("edEnabledLabel").textContent = r.enabled ? "已启用" : "已停用";
      $("edDir").value = r.dir;
      $("edPrompt").value = r.prompt;
      $("edModel").value = r.model;
      $("btnRun").disabled = !r.enabled;
      document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.tab === editorTab));
      $("paneSettings").classList.toggle("hidden", editorTab !== "settings");
      $("paneHistory").classList.toggle("hidden", editorTab !== "history");
      renderTriggers(r);
      $("edRuns").innerHTML = r.runs.length ? r.runs.map((run) => `
        <button class="run" type="button" data-run="${run.id}">
          <span class="dot ${run.status === "running" ? "run" : run.status === "succeeded" ? "ok" : run.status === "skipped" ? "skip" : "fail"}"></span>
          <span><div>${statusLabel(run.status)} · ${run.kind}</div>
          <div class="mono">${run.when}${run.skip ? " · " + run.skip : ""}</div></span>
        </button>`).join("") : `<div class="empty-page">还没有运行</div>`;
    }

    function openEditor(id) {
      selectedId = id;
      editorTab = "settings";
      page = "editor";
      $("trigMenu").classList.add("hidden");
      renderEditor();
      showPages();
    }

    function cur() { return rules.find((x) => x.id === selectedId); }

    $("cardList").addEventListener("click", (e) => {
      const tog = e.target.closest("[data-toggle]");
      if (tog) {
        e.stopPropagation();
        const r = rules.find((x) => x.id === tog.dataset.toggle);
        r.enabled = !r.enabled;
        toast(r.enabled ? "已重新启用（不补跑错过的定时）" : "已停用");
        renderList();
        return;
      }
      const open = e.target.closest("[data-open]");
      if (open) openEditor(open.dataset.open);
    });
    $("navAuto").onclick = () => { page = "list"; $("drawer").classList.add("hidden"); showPages(); renderList(); };
    $("navChat").onclick = () => { page = "chat"; showPages(); };
    $("btnBack").onclick = () => { page = "list"; openRunId = null; $("drawer").classList.add("hidden"); showPages(); renderList(); };
    $("btnNew").onclick = () => {
      const id = "n" + Date.now();
      rules.unshift({
        id, name: "", enabled: false, dir: "", prompt: "", model: "默认模型",
        triggers: [], runs: [],
      });
      openEditor(id);
    };
    $("edTitle").addEventListener("input", () => { cur().name = $("edTitle").textContent.trim(); });
    $("edSwitch").onclick = () => {
      const r = cur();
      r.enabled = !r.enabled;
      toast(r.enabled ? "已启用" : "已停用");
      renderEditor();
    };
    $("edDir").onchange = () => { cur().dir = $("edDir").value; };
    $("edPrompt").oninput = () => { cur().prompt = $("edPrompt").value; };
    $("edModel").onchange = () => { cur().model = $("edModel").value; };
    document.querySelectorAll(".tab").forEach((b) => {
      b.onclick = () => { editorTab = b.dataset.tab; renderEditor(); };
    });
    $("btnAddTrig").onclick = (e) => {
      e.stopPropagation();
      $("trigMenu").classList.toggle("hidden");
    };
    $("trigMenu").onclick = (e) => {
      const add = e.target.dataset.add;
      if (!add) return;
      const r = cur();
      if (add === "schedule") {
        r.triggers.push({ id: "t" + Date.now(), type: "schedule", mode: "cycle", cycle: "daily", time: "13:19" });
      } else {
        r.triggers.push({ id: "t" + Date.now(), type: "issue", events: [] });
      }
      $("trigMenu").classList.add("hidden");
      renderTriggers(r);
    };
    document.body.addEventListener("click", () => $("trigMenu").classList.add("hidden"));
    $("trigList").addEventListener("click", (e) => {
      const r = cur();
      const rm = e.target.closest("[data-rm]");
      if (rm) {
        r.triggers = r.triggers.filter((t) => t.id !== rm.dataset.rm);
        renderTriggers(r);
        return;
      }
      const mode = e.target.closest("[data-mode]");
      if (mode) {
        const t = r.triggers.find((x) => x.id === mode.closest("[data-tid]").dataset.tid);
        t.mode = mode.dataset.mode;
        if (t.mode === "interval") { t.every = t.every || 1; t.unit = t.unit || "h"; }
        renderTriggers(r);
      }
    });
    $("trigList").addEventListener("change", (e) => {
      const card = e.target.closest("[data-tid]");
      if (!card) return;
      const t = cur().triggers.find((x) => x.id === card.dataset.tid);
      if (e.target.dataset.f) t[e.target.dataset.f] = e.target.value;
      if (e.target.dataset.ev) {
        const v = e.target.dataset.ev;
        t.events = t.events || [];
        if (e.target.checked) t.events.push(v);
        else t.events = t.events.filter((x) => x !== v);
      }
    });
    $("btnRun").onclick = () => {
      const r = cur();
      if (!r.enabled) return toast("已停用，不能立即运行");
      if (r.runs.some((x) => x.status === "running")) {
        r.runs.unshift({ id: "s" + Date.now(), status: "skipped", when: "刚刚", kind: "手动", skip: "该规则已有一轮在跑" });
        toast("已跳过：同规则正在运行");
      } else {
        r.runs.unshift({ id: "m" + Date.now(), status: "running", when: "刚刚", kind: "手动" });
        toast("已开始手动运行");
      }
      editorTab = "history";
      renderEditor();
    };
    $("edRuns").addEventListener("click", (e) => {
      const b = e.target.closest("[data-run]");
      if (!b) return;
      openRunId = b.dataset.run;
      const r = cur();
      const run = r.runs.find((x) => x.id === openRunId);
      $("drawer").classList.remove("hidden");
      $("drawerTitle").textContent = `${statusLabel(run.status)} · ${run.kind}`;
      $("btnStop").hidden = run.status !== "running";
      $("drawerMsgs").innerHTML = run.status === "skipped"
        ? `<div class="bubble"><div class="k">系统</div>未启动 Agent。${run.skip}</div>`
        : `<div class="bubble"><div class="k">触发</div>${run.kind} · ${run.when}</div>
           <div class="bubble"><div class="k">指令</div>${r.prompt}</div>
           <div class="bubble"><div class="k">Agent</div>${run.status === "running" ? "正在处理…" : "检查完成，无需改动。"}</div>`;
    });
    $("drawerClose").onclick = () => $("drawer").classList.add("hidden");
    $("btnStop").onclick = () => {
      const run = cur().runs.find((x) => x.id === openRunId);
      run.status = "stopped";
      toast("已停止");
      renderEditor();
      $("btnStop").hidden = true;
    };
    $("btnDel").onclick = () => $("delMask").classList.remove("hidden");
    $("delCancel").onclick = () => $("delMask").classList.add("hidden");
    $("delOk").onclick = () => {
      const i = rules.findIndex((x) => x.id === selectedId);
      if (i >= 0) rules.splice(i, 1);
      $("delMask").classList.add("hidden");
      $("drawer").classList.add("hidden");
      page = "list";
      showPages();
      renderList();
    };
    $("themeBtn").onclick = () => {
      const html = document.documentElement;
      html.dataset.appearance = html.dataset.appearance === "dark" ? "light" : "dark";
      $("themeBtn").textContent = html.dataset.appearance === "dark" ? "浅色" : "深色";
    };
    renderList();
    showPages();
  </script>
</body>
</html>
